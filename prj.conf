# I2S
CONFIG_I2S=y
CONFIG_NRFX_I2S0=y
CONFIG_I2S_NRFX=n
# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Tiresias_DK"
# GPIO
CONFIG_GPIO=y
# Debug
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_DEBUG_OPTIMIZATIONS=y
# Log
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ZBUS=y
# Stacks and heaps
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384
# I2C
CONFIG_I2C=y
CONFIG_NRFX_TWIM1=y
CONFIG_NRFX_TIMER1=y
# NFC pins disable
CONFIG_NFCT_PINS_AS_GPIOS=y
# Storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_ZBUS=y